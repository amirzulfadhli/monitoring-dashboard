name: CI

# Verification only: the four release gates from the README. Nothing here
# starts the scheduler, contacts GitHub, calls DeepSeek, or deploys anything.
# The dashboard routes are client components prerendered as static shells, so
# the build step neither opens the database nor makes an outbound request.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned to the version this project is developed against: the test suite
      # and the app both rely on the built-in node:sqlite module.
      - uses: actions/setup-node@v4
        with:
          node-version: "22.15"
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build
